<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Fuego Vivo Gradient: Amarillo Sol -> Naranja Candela -> Rojo Cayena -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Diablo Arlequín Mask Gradient -->
    <linearGradient id="devilMaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Cuernos Dorados y Rojos -->
    <linearGradient id="hornsGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Harlequin Diamond Tricolor (Barranquilla: Amarillo, Verde, Rojo) -->
    <linearGradient id="harlequinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="harlequinGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Dark Shield Frame Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Fire Glow Filter -->
    <filter id="blazeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Protective Academic Shield Frame -->
  <polygon points="100,10 182,50 182,130 100,188 18,130 18,50" 
           fill="url(#badgeGrad)" stroke="#f59e0b" stroke-width="2.5" filter="url(#blazeGlow)"/>

  <!-- Inner Festive Rhythm Outline -->
  <polygon points="100,20 172,55 172,125 100,176 28,125 28,55" 
           fill="none" stroke="#dc2626" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 3"/>

  <!-- DIABLO ARLEQUÍN: Cuernos Curvos de Fuego -->
  <!-- Cuerno Izquierdo -->
  <path d="M72 74 C62 50 48 34 32 30 C38 48 54 62 66 80 Z" 
        fill="url(#hornsGrad)" stroke="#f59e0b" stroke-width="1.2" filter="url(#blazeGlow)"/>
  
  <!-- Cuerno Derecho -->
  <path d="M104 74 C100 50 94 32 82 20 C94 36 102 52 108 78 Z" 
        fill="url(#hornsGrad)" stroke="#f59e0b" stroke-width="1.2" filter="url(#blazeGlow)"/>

  <!-- Rostro / Máscara de Diablo (Perfil angular hacia la derecha botando fuego) -->
  <path d="M60 76 C65 65 82 65 96 72 C104 76 106 86 102 96 C98 104 90 108 92 114 C94 120 104 122 106 128 C102 134 88 138 78 134 C68 130 62 120 60 110 C58 98 56 86 60 76 Z" 
        fill="url(#devilMaskGrad)" stroke="#f87171" stroke-width="1.5"/>

  <!-- Ojo Ardiente del Diablo -->
  <polygon points="76,86 88,88 80,94" fill="#fef08a" filter="url(#blazeGlow)"/>
  <circle cx="82" cy="89" r="1.5" fill="#450a0a"/>

  <!-- Nariz / Rasgo de la Máscara -->
  <path d="M88 94 L94 102 L86 104" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Boca Abierta rugiendo / expulsando fuego -->
  <path d="M86 112 C92 110 98 112 104 116 C100 124 92 126 86 122 Z" fill="#180505"/>

  <!-- DIALBO ARLEQUÍN: Cuello de Arlequín con Cascabeles y Puntas (Tricolor Carnaval) -->
  <!-- Punta 1: Rojo Cayena -->
  <polygon points="56,128 40,146 62,148" fill="#dc2626" stroke="#fca5a5" stroke-width="0.8"/>
  <circle cx="40" cy="146" r="2.5" fill="#fbbf24"/>

  <!-- Punta 2: Amarillo Oro -->
  <polygon points="62,134 58,162 76,146" fill="url(#harlequinGold)" stroke="#fef08a" stroke-width="0.8"/>
  <circle cx="58" cy="162" r="2.5" fill="#fbbf24"/>

  <!-- Punta 3: Verde Congo -->
  <polygon points="76,138 84,166 94,142" fill="url(#harlequinGreen)" stroke="#6ee7b7" stroke-width="0.8"/>
  <circle cx="84" cy="166" r="2.5" fill="#fbbf24"/>

  <!-- Punta 4: Rojo & Oro Arlequín -->
  <polygon points="94,136 110,158 106,134" fill="#dc2626" stroke="#fca5a5" stroke-width="0.8"/>
  <circle cx="110" cy="158" r="2.5" fill="#fbbf24"/>

  <!-- LLAMARADA EXPLOSIVA (FUEGO BOTADO POR LA BOCA) -->
  <!-- Núcleo de Fuego Incandescente (Blanco - Amarillo) -->
  <path d="M98 114 C112 110 124 104 136 106 C128 112 120 116 110 120 Z" 
        fill="#ffffff" filter="url(#blazeGlow)"/>

  <!-- Lengua de Fuego Principal hacia la derecha superior -->
  <path d="M102 116 C118 108 132 92 152 86 C144 98 148 104 168 102 C152 112 156 122 176 120 C154 128 142 122 128 126 C116 128 108 124 102 118 Z" 
        fill="url(#fireGrad)" filter="url(#blazeGlow)"/>

  <!-- Llamarada Superior con Chispas -->
  <path d="M124 100 C136 84 148 70 162 62 C154 74 160 80 170 78 C158 90 148 94 136 98 Z" 
        fill="url(#fireGrad)" opacity="0.9" filter="url(#blazeGlow)"/>

  <!-- Llamarada Inferior Envolvente -->
  <path d="M116 124 C132 130 144 142 158 146 C146 142 140 134 130 132 Z" 
        fill="url(#fireGrad)" opacity="0.85"/>

  <!-- Chispas y Brasas Volando (Escupir Candela) -->
  <circle cx="166" cy="68" r="2" fill="#fef08a" filter="url(#blazeGlow)"/>
  <circle cx="178" cy="94" r="2.5" fill="#ffffff" filter="url(#blazeGlow)"/>
  <circle cx="184" cy="116" r="2" fill="#fbbf24" filter="url(#blazeGlow)"/>
  <circle cx="168" cy="138" r="1.8" fill="#ea580c"/>
  <circle cx="148" cy="74" r="1.5" fill="#fef08a"/>
</svg>
